:root { --paper: #fbf8f5; --sheet: #ffffff; --ink: #2a2226; --muted: #7d6f75; --line: #ece3e6; --accent: #b3264f; --accent-ink: #ffffff; --red: #c0392b; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --paper: #1c1719; --sheet: #251e21; --ink: #f3eaee; --muted: #b3a2a9; --line: #3a2f33; --accent: #f07399; --accent-ink: #2a0f18; --red: #f08070; color-scheme: dark; } }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); }
body { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; display: grid; place-items: center; padding: 24px 16px; }
.wrap { width: min(340px, 100%); display: flex; flex-direction: column; gap: 14px; }
.form { display: flex; flex-direction: column; gap: 14px; }
h1 { font-family: "Didot", "Bodoni 72", Georgia, serif; font-style: italic; font-weight: 400; font-size: 2.6rem; margin: 0 0 4px; }
p { margin: 0; color: var(--muted); }
.field { position: relative; }
/* a masked text field instead of type=password, so password-manager extensions don't cover the form */
.masked { -webkit-text-security: disc; text-security: disc; }
input[type=text] { font-size: 16px; padding: 12px 70px 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--sheet); color: var(--ink); width: 100%; }
.show { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); background: none; border: 0; color: var(--accent); font-size: .85rem; font-weight: 600; padding: 8px; cursor: pointer; }
input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
label.rem { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: .92rem; }
label.rem input { width: 18px; height: 18px; accent-color: var(--accent); }
.go { font-size: 1rem; font-weight: 600; padding: 12px; border-radius: 999px; border: 0; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
.go:disabled { opacity: .6; }
.msg { font-size: .9rem; min-height: 1.2em; }
.msg.err { color: var(--red); }
.shake { animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
@media (prefers-reduced-motion: reduce) { .shake { animation: none; } }
</style>

  const KEY = "s-plan-key";
  const un = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const norm = s => s.trim().normalize("NFC").replace(/[‐-―−]/g, "-");
  const form = document.getElementById("gate"), msg = document.getElementById("msg"), go = document.getElementById("go"), pw = document.getElementById("pw");
  const say = (text, isErr) => { msg.textContent = text; msg.className = "msg" + (isErr ? " err" : ""); };
  async function open(key) {
    const buf = await crypto.subtle.decrypt({ name: "AES-GCM", iv: un(P.i) }, key, un(P.c));
    const html = new TextDecoder().decode(buf);
    window.removeEventListener("error", onErr); // the app takes over from here
    document.open(); document.write(html); document.close();
  }
  if (!window.crypto || !crypto.subtle || !window.TextEncoder) { fail("This browser can't open s-plan here. Open the https link in Safari or Chrome."); return; }

  if (saved) {
    try { await open(await crypto.subtle.importKey("raw", un(saved), "AES-GCM", true, ["decrypt"])); return; }
    catch { try { localStorage.removeItem(KEY); } catch {} } // password changed since; ask again

  document.getElementById("show").addEventListener("click", e => {
    const showing = !pw.classList.contains("masked"); pw.classList.toggle("masked", showing);
    e.currentTarget.textContent = showing ? "Show" : "Hide"; e.currentTarget.setAttribute("aria-pressed", String(!showing)); pw.focus();

  pw.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); unlock(); } });

  async function unlock() {
    if (busy) return;
    const value = norm(pw.value);
    if (!value) { say("Type the passphrase first.", true); return; }

    go.disabled = true; go.textContent = "Checking…"; say("Checking…", false);

    catch { say("The passphrase was right, but s-plan couldn't open. Reload the page and try again.", true); go.disabled = false; go.textContent = "Open"; busy = false; }
